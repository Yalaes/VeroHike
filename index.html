<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeroHike</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <button type="button" ="Open menu" class="menu-button" id="menu-button">
          ☰
        </button>
        <h1 class="app-title">VeroHike</h1>
      </header>

      <!-- nav main menu -->
      <nav id="main-menu" class="main-menu">
        <ul class="menu-list">
          <li class="menu-item">
            <button type="button" data-section="home">Home</button>
          </li>
          <li class="menu-item">
            <button type="button" data-section="hike">Rando</button>
          </li>
          <li class="menu-item">
            <button type="button" data-section="history">Historique</button>
          </li>

          <li class="menu-item">
            <button type="button" data-section="settings">Paramètres</button>
          </li>
        </ul>
      </nav>
      <!-- end nav main menu -->

      <!-- Main container -->
      <main class="app-main">
        <!-- home section -->
        <section class="app-section active" id="home">
          <h2>Accueil</h2>

          <button
            type="button"
            id="start-hike-button"
            class="start-hike-button"
          >
            Démarrer la rando
          </button>
        </section>
        <!-- End home section -->

        <!-- Rando section  -->
        <section class="app-section" id="hike">
          <div class="stats">
            <div class="stat">
              <h3>Duration</h3>
              <p id="hike-duration">00:00:00</p>
            </div>
            <div class="stat">
              <h3>Distance</h3>
              <p id="hike-distance">0.00 km</p> 
          </div>
          <div class="stat">
              <h3>Pas</h3>
              <p id="hike-steps">0</p>
            </div>
            <div class="hike-controls">
              <button id="pause-hike-button" type="button">Pause</button>
              <button id="stop-hike-button" type="button">Stop</button>
            </div>
        </section>
        <!-- end Rando section -->

        <section class="app-section" id="history">Historique</section>
        <section class="app-section" id="settings">Paramètres</section>
      </main>
      <!-- End main container    -->

      <!-- Notifications (eg: weather alerts) -->
      <div
        aria-live="polite"
        class="app-notifications"
        id="notifications"
      ></div>

      <!-- footer -->
      <footer class="app-footer">
        <p>© 2026 VeroHike · Open Source</p>
      </footer>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
